name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - kill_process_before_r8
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_apk:
    name: "build"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      security-events: write

    timeout-minutes: 59

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23

      - name: Processs Watcher
        uses: cdsap/build-process-watcher@main
        with:
            remote_monitoring: true
            collect_gc: true

      - name: Check build-logic
        run: ./gradlew :app:app:assembleRelease
        env:
           DEVELOCITY_ACCESS_KEY: ${{ secrets."DV_ACCESS_KEY" }}
